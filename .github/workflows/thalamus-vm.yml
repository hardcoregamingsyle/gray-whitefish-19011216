name: Thalamus VM Deploy

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Start server
        run: npx serve -s . -l 3000 --host 0.0.0.0 &
      - name: Health check
        run: sleep 3 && curl -f http://0.0.0.0:3000
      - name: Deploy to Cloudflare Tunnel
        run: |
          curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CF_ACCOUNT_ID }}/tunnels" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"name":"thalamus-vm-'${{ github.run_id }}'","tunnel_secret":"'${{ secrets.TUNNEL_SECRET }}'"}'